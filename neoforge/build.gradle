architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url "https://maven.shedaniel.me/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:$neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}


String fileName = "frost-walker-plus-${project.version}-neoforge"

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev"
    archiveVersion = "v${mod_version}"
    archiveBaseName = fileName
}

sourcesJar {
    Jar commonSources = project(":common").sourcesJar
    dependsOn commonSources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from commonSources.archiveFile.map { zipTree(it) }
}

remapSourcesJar {
    archiveVersion = "v${mod_version}"
    archiveBaseName = fileName
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = "neoforge"
    archiveVersion = "v${mod_version}"
    archiveBaseName = fileName
}

curseforge {
    apiKey = project.hasProperty("curseforge_api_token") ? curseforge_api_token : ""
    project {
        id = "1275210"
        changelog = rootProject.file("CHANGE_LOG.md").text
        changelogType = "markdown"
        releaseType = "release"
        addGameVersion "NeoForge"
        addGameVersion minecraft_version
        addGameVersion "Java 21"
        mainArtifact remapJar.archiveFile
        afterEvaluate {
            uploadTask.dependsOn(remapJar)
        }
    }
    options {
        forgeGradleIntegration = false
    }
}

modrinth {
    token = project.hasProperty("modrinth_api_token") ? modrinth_api_token : ""
    projectId = "nrwl52c3"
    versionName = "Frost Walker + ${rootProject.mod_version} ${minecraft_version} NeoForge"
    versionNumber = "frost-walker+-" + rootProject.mod_version + "-fabric"
    uploadFile = remapJar
    changelog = rootProject.file("CHANGE_LOG.md").text
    gameVersions = ["${minecraft_version}"]
    loaders = ["neoforge"]
    dependencies {
        required.version "architectury-api", "17.0.8+neoforge"
    }
}